[pytest]
markers =
    slow: constructs a Qt interface (QApplication/MainWindow/pages) and/or hits the database - part of the full suite, not the fast dozen-second slice (see gui_smoke/README.md).
    gui: builds real PySide6 widgets (MainWindow, a page, or a dialog) - always also marked slow.

# Task (feature/retention-and-test-fix, Part A): pytest-qt is installed
# in this environment but nothing in this codebase uses its qtbot
# fixture - yet its own pytest_runtest_teardown hook unconditionally
# calls QApplication.processEvents() after EVERY test in the whole
# session (not just ones that opt in), the moment any QApplication
# exists (gui_smoke/'s own session-scoped `qapp` fixture creates one).
# Combined with epw_os/tests/ + gui_smoke/ run together at full scale,
# this was a confirmed, reproducible native crash site (Windows
# "access violation" inside pytestqt/plugin.py's own _process_events())
# - see SESSION_REPORT.md for the crash trace and how this was found.
# Disabled globally since it provides no value here and the crash it
# causes is real; the two suites should still always be run as separate
# invocations for other reasons (see gui_smoke/README.md).
addopts = -p no:pytest-qt
