name: EPW Platform CI

# Trzy niezależne zadania — jedno na każdą część platformy.
# Każde uruchamia się tylko wtedy, gdy zmieniły się jego pliki,
# żeby zmiana w edytorze nie przeliczała testów runtime'u i odwrotnie.

on:
  push:
    branches: [ "main", "feature/*", "fix/*", "refactor/*", "chore/*" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # ==========================================================
  # RUNTIME — EPW Runtime (Python / PySide6)
  # ==========================================================
  runtime:
    name: Runtime
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        working-directory: runtime

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-render0 \
            libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 libxcb-shm0 \
            libxcb-sync1 libxcb-xkb1 libxcb1 libx11-xcb1 libdbus-1-3 \
            libfontconfig1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Headless core smoke test
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          python test_headless.py

      - name: Pytest suite
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          pytest -q epw_os/tests/

      - name: GUI smoke suite
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          pytest -q gui_smoke/

  # ==========================================================
  # STUDIO / LOGIC — edytor logiki (Python / PySide6)
  # ==========================================================
  studio-logic:
    name: Studio — Logic Editor
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        working-directory: studio/logic

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-render0 \
            libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 libxcb-shm0 \
            libxcb-sync1 libxcb-xkb1 libxcb1 libx11-xcb1 libdbus-1-3 \
            libfontconfig1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Pytest suite
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          pytest -q tests/

  # ==========================================================
  # STUDIO / SYNOPTIC — edytor ekranów (React / TypeScript)
  # ==========================================================
  studio-synoptic:
    name: Studio — Synoptic Editor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio/synoptic

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: studio/synoptic/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build
