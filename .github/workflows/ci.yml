name: EPW Platform CI

# Pięć niezależnych zadań: jedno na każdą część platformy (runtime,
# Logic Editor, Shell, Synoptic Editor) plus jedno międzyplatformowe
# (task "migracja adresacji" etap 4 - jedna karta, ta sama adresacja
# wszędzie). Uwaga: żadne z nich NIE jest dziś ograniczone `paths:` do
# tylko-swoich-plików (ten komentarz kiedyś to sugerował - nieprawdziwie,
# sprawdzone: nie ma tu żadnego `paths:`) - każdy push/PR na branche
# poniżej uruchamia wszystkie pięć.

on:
  push:
    branches: [ "main", "feature/*", "fix/*", "refactor/*", "chore/*" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # ==========================================================
  # RUNTIME — EPW Runtime (Python / PySide6)
  # ==========================================================
  runtime:
    name: Runtime
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        working-directory: runtime

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-render0 \
            libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 libxcb-shm0 \
            libxcb-sync1 libxcb-xkb1 libxcb1 libx11-xcb1 libdbus-1-3 \
            libfontconfig1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Headless core smoke test
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          python test_headless.py

      - name: Pytest suite
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          pytest -q epw_os/tests/

      - name: GUI smoke suite
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          pytest -q gui_smoke/

  # ==========================================================
  # STUDIO / LOGIC — edytor logiki (Python / PySide6)
  # ==========================================================
  # fix/logic-tests-regression: this job used to run with
  # working-directory: studio/logic - the exact reason 12 tests (all
  # CWD-relative hardcoded paths - "examples/...", "logic_studio/core/
  # ...") passed here for over a year while silently failing whenever
  # anyone ran `pytest studio/logic` from the repo root instead. CI
  # itself could never have caught its own regression as long as it
  # kept invoking things the one way that happened to hide it. Now runs
  # from the repo root - the same way this branch's own report was
  # produced - so a future reintroduction of a CWD-relative path fails
  # here too, not just in a human's own local invocation.
  studio-logic:
    name: Studio — Logic Editor
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-render0 \
            libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 libxcb-shm0 \
            libxcb-sync1 libxcb-xkb1 libxcb1 libx11-xcb1 libdbus-1-3 \
            libfontconfig1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/logic/requirements.txt
          pip install pytest

      - name: Pytest suite
        run: pytest -q studio/logic/tests/

  # ==========================================================
  # STUDIO / SHELL — powłoka EPW Studio (Python / PySide6)
  # ==========================================================
  # Task "migracja adresacji" etap-4 follow-up: this job did not exist
  # before - studio/shell's own 100+ tests (including this task's own
  # cross-platform grammar test) ran only on someone's local machine,
  # covered by no automatic guarantee at all. Runs from the repo root
  # from day one - studio-logic's own job comment above already
  # documents exactly what invoking tests from the wrong directory can
  # hide, so this one never gets a chance to develop that same disease.
  studio-shell:
    name: Studio — Shell
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-render0 \
            libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 libxcb-shm0 \
            libxcb-sync1 libxcb-xkb1 libxcb1 libx11-xcb1 libdbus-1-3 \
            libfontconfig1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/shell/requirements.txt
          pip install pytest

      - name: Pytest suite
        run: pytest -q studio/shell/tests/

  # ==========================================================
  # STUDIO / SYNOPTIC — edytor ekranów (React / TypeScript)
  # ==========================================================
  studio-synoptic:
    name: Studio — Synoptic Editor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio/synoptic

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: studio/synoptic/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build

  # ==========================================================
  # CROSS-PLATFORM — jedna karta, ta sama adresacja wszędzie
  # ==========================================================
  # Task "migracja adresacji" etap 4 - THE platform-wide proof, not one
  # of the three per-program suites above: shared/tests/
  # test_cross_platform_card_wiring.py feeds ONE card definition through
  # Studio's, runtime's AND Logic Studio's own real address/tag
  # generators and asserts they produce the identical set of strings -
  # this needs all three Python trees importable in the SAME process
  # (see that test's own module docstring for how), so it gets its own
  # job rather than living inside any single program's.
  cross-platform:
    name: Cross-platform addressing
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-render0 \
            libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 libxcb-shm0 \
            libxcb-sync1 libxcb-xkb1 libxcb1 libx11-xcb1 libdbus-1-3 \
            libfontconfig1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r runtime/requirements.txt
          pip install -r studio/logic/requirements.txt
          pip install -r studio/shell/requirements.txt
          pip install pytest

      - name: Pytest suite
        run: pytest -q shared/tests/
